<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 900" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="520" height="900" fill="#020617"/>

  <!-- header -->
  <rect x="215" y="24" width="90" height="26" rx="13" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b"/>
  <circle cx="233" cy="37" r="4" fill="#34d399"/>
  <text x="243" y="41" font-size="12" fill="#cbd5e1">Testnet</text>
  <text x="260" y="80" font-size="30" font-weight="700" fill="#f1f5f9" text-anchor="middle">Stellar Payment dApp</text>
  <text x="260" y="100" font-size="14" fill="#94a3b8" text-anchor="middle">Send XLM on the Stellar Testnet with Freighter.</text>

  <!-- wallet card -->
  <rect x="20" y="128" width="480" height="96" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b"/>
  <text x="40" y="162" font-size="18" font-weight="600" fill="#f1f5f9">Wallet</text>
  <text x="40" y="190" font-size="14" fill="#cbd5e1" font-family="ui-monospace, Menlo, Consolas, monospace">GABC...WXYZ</text>
  <rect x="376" y="140" width="104" height="34" rx="8" fill="none" stroke="#334155"/>
  <text x="428" y="162" font-size="14" fill="#e2e8f0" text-anchor="middle">Disconnect</text>

  <!-- balance card -->
  <rect x="20" y="240" width="480" height="120" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b"/>
  <text x="40" y="274" font-size="18" font-weight="600" fill="#f1f5f9">XLM Balance</text>
  <rect x="396" y="252" width="84" height="32" rx="8" fill="none" stroke="#334155"/>
  <text x="438" y="273" font-size="14" fill="#e2e8f0" text-anchor="middle">Refresh</text>
  <text x="40" y="326" font-size="24" font-weight="600" fill="#f1f5f9">9999.9999900 <tspan font-size="16" font-weight="400" fill="#94a3b8">XLM</tspan></text>

  <!-- payment form card -->
  <rect x="20" y="376" width="480" height="300" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b"/>
  <text x="40" y="404" font-size="18" font-weight="600" fill="#f1f5f9">Send XLM</text>

  <text x="40" y="430" font-size="14" fill="#cbd5e1">Destination address</text>
  <rect x="40" y="438" width="440" height="40" rx="8" fill="#020617" stroke="#334155"/>
  <text x="52" y="463" font-size="12" fill="#f1f5f9" font-family="ui-monospace, Menlo, Consolas, monospace">GABCQNLX7QOX2C7SUW4F2PVFXV6QKCVK6PYBZBUAYX44VLCVMLPRWXYZ</text>

  <text x="40" y="504" font-size="14" fill="#cbd5e1">Amount (XLM)</text>
  <rect x="40" y="512" width="440" height="40" rx="8" fill="#020617" stroke="#334155"/>
  <text x="52" y="537" font-size="14" fill="#f1f5f9">12.5</text>

  <text x="40" y="578" font-size="14" fill="#cbd5e1">Memo (optional)</text>
  <rect x="40" y="586" width="90" height="40" rx="8" fill="#020617" stroke="#334155"/>
  <text x="52" y="611" font-size="14" fill="#f1f5f9">Text</text>
  <rect x="138" y="586" width="342" height="40" rx="8" fill="#020617" stroke="#334155"/>
  <text x="150" y="611" font-size="14" fill="#f1f5f9">order-42</text>

  <rect x="40" y="642" width="440" height="40" rx="8" fill="#059669"/>
  <text x="260" y="667" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Send payment</text>

  <!-- success card -->
  <rect x="20" y="692" width="480" height="160" rx="12" fill="#064e3b" fill-opacity="0.2" stroke="#065f46" stroke-opacity="0.5"/>
  <text x="40" y="722" font-size="16" font-weight="600" fill="#6ee7b7">Payment successful 🎉</text>
  <text x="40" y="746" font-size="14" fill="#a7f3d0">Amount: <tspan font-family="ui-monospace, Menlo, Consolas, monospace">12.5 XLM</tspan></text>
  <text x="40" y="766" font-size="14" fill="#a7f3d0">To: <tspan font-family="ui-monospace, Menlo, Consolas, monospace">GABC...WXYZ</tspan></text>
  <text x="40" y="786" font-size="14" fill="#a7f3d0">Memo (text): <tspan font-family="ui-monospace, Menlo, Consolas, monospace">order-42</tspan></text>
  <text x="40" y="812" font-size="11" fill="#6ee7b7" fill-opacity="0.7" font-family="ui-monospace, Menlo, Consolas, monospace">45127658402f5d8d8123437c8553dd5a</text>
  <text x="40" y="826" font-size="11" fill="#6ee7b7" fill-opacity="0.7" font-family="ui-monospace, Menlo, Consolas, monospace">f4f04947d35bf43f0b635ee3aa1d8ae7</text>
  <text x="40" y="844" font-size="14" fill="#34d399" text-decoration="underline">View on Stellar Expert →</text>

  <!-- footer -->
  <text x="260" y="888" font-size="12" fill="#475569" text-anchor="middle">Testnet only — no real funds are used.</text>
</svg>
